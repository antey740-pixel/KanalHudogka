<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
    <style>
        :root { --thumb-size: 450px; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #ddd; margin: 0; padding: 0; }
        .container { width: 98%; max-width: 1600px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .header-nav { 
            position: sticky; top: 0; background: rgba(20, 20, 20, 0.95); 
            backdrop-filter: blur(10px); border-bottom: 1px solid #333; 
            z-index: 1000; padding: 15px 0; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap;
        }
        .btn { 
            display: inline-block; color: #fff; text-decoration: none; background: #222; 
            padding: 10px 25px; border-radius: 30px; margin: 0 5px; font-weight: 500;
            border: 1px solid #444; transition: all 0.1s ease; font-size: 14px; cursor: pointer;
        }
        .btn:hover { background: #00d4ff; border-color: #00d4ff; color: #000; }
        .btn-active { background: #ffcc00; color: #000; border: none; }
        .btn-review { background: #8b0000; border-color: #ff4444; }
        .btn-review:hover { background: #ff0000; border-color: #ff0000; }
        .btn-review.active { background: #ffcc00; color: #000; border-color: #ffcc00; }

        .size-control { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 30px; border: 1px solid #444; color: #fff; font-size: 12px; }
        .size-control input { cursor: pointer; width: 100px; }

        h1 { text-align: center; margin-top: 30px; color: #fff; font-weight: 300; }
        h2 { color: #ffcc00; border-left: 4px solid #ffcc00; padding-left: 15px; margin: 40px 0 15px 0; font-size: 1.3rem; clear: both; }
        
        .user-list { list-style: none; padding: 0; margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .user-item { background: #161616; border-radius: 12px; border: 1px solid #222; transition: 0.1s; }
        .user-item:hover { background: #222; border-color: #00d4ff; transform: translateX(5px); }
        .user-link { display: flex; align-items: center; padding: 15px 20px; color: #00d4ff; text-decoration: none; font-size: 1.1rem; }
        .list-num { background: #ffcc00; color: #000; font-weight: bold; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-right: 15px; flex-shrink: 0; }

        .gallery { display: grid !important; grid-template-columns: repeat(auto-fit, var(--thumb-size)) !important; justify-content: center !important; gap: 15px !important; margin-bottom: 30px; width: 100%; }
        .gallery-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #222; background: #000; display: flex; flex-direction: column; }
        .gallery-item img { width: 100%; height: auto; display: block; cursor: pointer; transition: 0.2s; }
        .gallery-item:hover img { transform: scale(1.03); }
        
        .tag-badge { background: #111; color: #ffcc00; padding: 8px 10px; font-size: 12px; font-weight: bold; border-top: 1px solid #333; text-align: center; }

        .comment-toggle {
            background: #1a1a1a;
            color: #00d4ff;
            border: none;
            border-top: 1px solid #333;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: 0.15s;
        }
        .comment-toggle:hover { background: #222; color: #ffcc00; }
        .comment-box {
            display: none;
            background: #0f0f0f;
            border-top: 1px solid #333;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .comment-box.open { display: block; }

        #review-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; display: none; cursor: crosshair; touch-action: none; background: transparent !important; pointer-events: none; }
        #review-canvas.active { display: block !important; pointer-events: auto; }
        
        #review-tools { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100000; background: rgba(0,0,0,0.9); padding: 10px 25px; border-radius: 50px; display: none; gap: 15px; align-items: center; border: 2px solid #ffcc00; }
        .btn-clear { background: #444; color: #fff; border: none; padding: 5px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        .btn-exit { background: #8b0000; border-color: #ff4444; }

        /* --- КНОПКА ПАЛИТРЫ --- */
        .btn-color {
            width: 30px; height: 30px; border-radius: 50%;
            background: #f00;
            border: 2px solid #fff;
            cursor: pointer;
            padding: 0;
        }
        .btn-color:hover { transform: scale(1.1); }

        /* --- ПАНЕЛЬ ПАЛИТРЫ --- */
        #palette-panel {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            z-index: 100001; background: rgba(0,0,0,0.95);
            padding: 12px; border-radius: 12px;
            display: none; border: 2px solid #ffcc00;
        }
        #palette-panel.open { display: block; }

        .palette {
            display: grid;
            grid-template-columns: repeat(10, 26px);
            grid-auto-rows: 26px;
            gap: 3px;
        }

        .swatch {
            width: 26px; height: 26px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.1s;
            box-sizing: border-box;
        }
        .swatch:hover {
            transform: scale(1.15);
            border-color: #fff;
            z-index: 2;
        }
        .swatch.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px #ffcc00, 0 0 10px rgba(255,204,0,0.8);
            transform: scale(1.1);
        }

        @media (max-width: 700px) {
            .palette { grid-template-columns: repeat(10, 18px); grid-auto-rows: 18px; }
            .swatch { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>
    <div class="header-nav">
        <a href="index.html" class="btn ">🏠 ГЛАВНАЯ</a>
        <a href="all_photos.html" class="btn ">🖼️ ВСЕ ФОТО (ВЫСТАВКА)</a>
        <div class="size-control">
            <span>Размер:</span>
            <input type="range" id="sizeSlider" min="150" max="2000" value="450">
        </div>
        <button id="reviewToggleBtn" class="btn btn-review">✏️ РЕЖИМ РАЗБОРА</button>
    </div>
    <canvas id="review-canvas"></canvas>
    <div id="review-tools">
        <button class="btn-color" id="colorPickerBtn" title="Палитра"></button>
        <button class="btn-clear" onclick="clearCanvas()">ОЧИСТИТЬ</button>
        <button class="btn-clear btn-exit" onclick="toggleReview()">ВЫЙТИ</button>
        <span style="color:#ffcc00; font-size:11px; margin-left:10px;">РЕЖИМ РАЗБОРА</span>
    </div>

    <!-- ПАНЕЛЬ ПАЛИТРЫ -->
    <div id="palette-panel">
        <div class="palette" id="palette"></div>
    </div>

<div class="container">
<h1>05_D. Татьяна</h1><div class='gallery'>
            <div class="gallery-item">
                <a href="assets/user6271502728/05_D_Татьяна_1.jpg" data-fancybox="user_user6271502728" data-caption="05_D. Татьяна | 05_D_Татьяна_1.jpg">
                    <img src="assets/user6271502728/05_D_Татьяна_1.jpg" loading="lazy">
                </a>
                <div class="tag-badge">05_D_Татьяна_1.jpg</div>
                
            </div></div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script>
        const sizeSlider = document.getElementById('sizeSlider');
        const savedSize = localStorage.getItem('thumbSize') || '450';
        sizeSlider.value = savedSize;
        document.documentElement.style.setProperty('--thumb-size', savedSize + 'px');

        sizeSlider.addEventListener('input', function() {
            const val = this.value + 'px';
            document.documentElement.style.setProperty('--thumb-size', val);
            localStorage.setItem('thumbSize', this.value);
        });

        // --- КОММЕНТАРИИ ---
        document.querySelectorAll('.comment-toggle').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const box = this.nextElementSibling;
                const isOpen = box.classList.toggle('open');
                this.textContent = isOpen ? '💬 Скрыть комментарий' : '💬 Показать комментарий';
            });
        });

        const canvas = document.getElementById('review-canvas');
        const ctx = canvas.getContext('2d');
        const tools = document.getElementById('review-tools');
        const toggleBtn = document.getElementById('reviewToggleBtn');
        let isDrawing = false;
        let active = false;

        // --- ПАЛИТРА (10 столбцов × 8 строк, как на рисунке) ---
PALETTE = [
    ['#ff0000', '#ffffff', '#e8e8e8', '#cccccc', '#b3b3b3', '#999999', '#808080', '#666666', '#3f3f3f', '#1a1a1a'],
    ['#0a3a5a', '#0a1a5a', '#3a0a5a', '#5a0a3a', '#7a0a0a', '#7a2a0a', '#6a4a0a', '#5a5a0a', '#3a5a0a', '#0a4a0a'],
    ['#0a5a8a', '#0a2a8a', '#5a0a8a', '#8a0a5a', '#a01a1a', '#a03a0a', '#8a5a0a', '#7a7a0a', '#4a7a0a', '#0a6a0a'],
    ['#1a7aaa', '#1a3aaa', '#7a1aaa', '#aa1a7a', '#c02a2a', '#c04a0a', '#aa7a0a', '#9a9a0a', '#5a9a0a', '#1a8a1a'],
    ['#2a9aca', '#2a5aca', '#9a2aca', '#ca2a9a', '#e03a3a', '#e05a0a', '#ca9a0a', '#baba0a', '#6aba0a', '#2aaa2a'],
    ['#4abaea', '#4a7aea', '#ba4aea', '#ea4aba', '#f06a6a', '#f08a2a', '#eaba2a', '#dada2a', '#8ada2a', '#4aca4a'],
    ['#7adafa', '#7aaafa', '#da7afa', '#fa7ada', '#fa9a9a', '#faaa6a', '#fada6a', '#fafa6a', '#aafa6a', '#7aea7a'],
    ['#baeafa', '#bad6fa', '#eabafa', '#fabaea', '#facaca', '#fad6aa', '#faeaaa', '#fafaaa', '#dafaaa', '#bafaca']
];
        const palettePanel = document.getElementById('palette-panel');
        const colorPickerBtn = document.getElementById('colorPickerBtn');

        function setStroke(c) {
            ctx.strokeStyle = c;
            colorPickerBtn.style.background = c;
        }

        function buildPalette() {
            const palette = document.getElementById('palette');
            palette.innerHTML = '';
            PALETTE.forEach(row => {
                row.forEach(color => {
                    const d = document.createElement('div');
                    d.className = 'swatch';
                    d.style.background = color;
                    d.addEventListener('click', () => {
                        setStroke(color);
                        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                        d.classList.add('active');
                    });
                    palette.appendChild(d);
                });
            });
        }

        colorPickerBtn.addEventListener('click', () => {
            palettePanel.classList.toggle('open');
        });

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function toggleReview() {
            active = !active;
            if (active) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#f00';
                canvas.classList.add('active');
                tools.style.display = 'flex';
                toggleBtn.classList.add('active');
                toggleBtn.textContent = '✏️ РЕЖИМ РАЗБОРА (ВКЛ)';
            } else {
                canvas.classList.remove('active');
                tools.style.display = 'none';
                toggleBtn.classList.remove('active');
                toggleBtn.textContent = '✏️ РЕЖИМ РАЗБОРА';
                palettePanel.classList.remove('open');
            }
        }

        toggleBtn.addEventListener('click', toggleReview);

        canvas.addEventListener('mousedown', (e) => { if(!active) return; isDrawing=true; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', (e) => { if(!active || !isDrawing) return; ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => isDrawing=false);
        
        canvas.addEventListener('touchstart', (e) => {
            if (!active) return; e.preventDefault(); const t = e.touches[0];
            isDrawing = true; ctx.beginPath(); ctx.moveTo(t.clientX, t.clientY);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (!active || !isDrawing) return; e.preventDefault(); const t = e.touches[0];
            ctx.lineTo(t.clientX, t.clientY); ctx.stroke();
        });
        canvas.addEventListener('touchend', () => isDrawing = false);

        Fancybox.bind('[data-fancybox]', {
            Carousel: { infinite: false },
            on: { closing: () => { if(active) toggleReview(); clearCanvas(); }, 'Carousel.change': () => clearCanvas() }
        });

        buildPalette();
        setStroke('#ff0000');
    </script>
</body>
</html>
